<svg xmlns="http://www.w3.org/2000/svg" width="620" height="448" viewBox="0 0 620 448" role="img" aria-labelledby="title desc">
<title id="title">AI gives the context. A person sends the reply.</title>
<desc id="desc">Illustrative flow. A fan's message goes to a human chatter. Behind the scenes, AI gathers past conversations, purchases, preferences, boundaries, payday, promises and earlier shift notes into a fan brief beside the chat. The chatter reads the chat and the brief, decides what to say and sends the reply. There is no connection from the AI to the fan.</desc>
<defs>
 <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1AA3F5"/></marker>
 <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#36D399"/></marker>
</defs>
<rect x="1" y="1" width="618" height="446" rx="24" fill="#0e2134" stroke="#284960"/>
<g font-family="Arial,sans-serif">
 <circle cx="36" cy="36" r="4" fill="#36D399"/><text x="51" y="41" fill="#9cbacf" font-size="12" letter-spacing="1.4">AI-ASSISTED HUMAN CHATTING</text>
 <path d="M30 61H590" stroke="#284960"/>
 <text x="30" y="87" fill="#9CE3CE" font-size="11" letter-spacing="1.3">WITH THE FAN</text>
 <text x="590" y="87" fill="#87d9ff" font-size="11" letter-spacing="1.3" text-anchor="end">BEHIND THE SCENES</text>
 <path d="M310 74V404" stroke="#284960" stroke-dasharray="3 6"/>

 <!-- Fan message -->
 <rect x="30" y="100" width="250" height="80" rx="16" fill="#1B4662" stroke="#4487AA"/>
 <text x="48" y="122" fill="#76CFFF" font-size="11" letter-spacing="1">FAN MESSAGE · SUNDAY</text>
 <text x="48" y="147" fill="#F0FAFF" font-size="16">“I'm back. Did you find</text>
 <text x="48" y="168" fill="#F0FAFF" font-size="16">out about the next set?”</text>
 <path d="M155 182V208" stroke="#36D399" stroke-width="2" marker-end="url(#ag)"/>

 <!-- Human chatter -->
 <rect x="30" y="214" width="250" height="128" rx="16" fill="#133A3D" stroke="#36D399" stroke-width="1.6"/>
 <circle cx="54" cy="236" r="5" fill="#36D399"/>
 <text x="67" y="240" fill="#9CE3CE" font-size="12" letter-spacing="1.3" font-weight="700">HUMAN CHATTER</text>
 <text x="48" y="270" fill="#EAFBF4" font-size="16"><tspan fill="#36D399" font-weight="700">1 </tspan> Reads the chat + brief</text>
 <text x="48" y="298" fill="#EAFBF4" font-size="16"><tspan fill="#36D399" font-weight="700">2 </tspan> Decides what to say</text>
 <text x="48" y="326" fill="#EAFBF4" font-size="16"><tspan fill="#36D399" font-weight="700">3 </tspan> Types it and sends it</text>
 <path d="M155 344V364" stroke="#36D399" stroke-width="2" marker-end="url(#ag)"/>
 <rect x="30" y="368" width="250" height="36" rx="18" fill="#36D399"/>
 <text x="155" y="391" fill="#06231a" font-size="14" font-weight="700" text-anchor="middle">Reply to the fan, sent by a person</text>

 <!-- AI context -->
 <rect x="340" y="100" width="250" height="162" rx="16" fill="#10283d" stroke="#1AA3F5" stroke-dasharray="6 5"/>
 <text x="358" y="123" fill="#87d9ff" font-size="12" letter-spacing="1.3" font-weight="700">AI · GATHERS CONTEXT</text>
 <g fill="#1AA3F5"><circle cx="362" cy="144" r="3"/><circle cx="362" cy="168" r="3"/><circle cx="362" cy="192" r="3"/><circle cx="362" cy="216" r="3"/><circle cx="362" cy="240" r="3"/></g>
 <g fill="#cfe6f5" font-size="14"><text x="374" y="149">Past conversations</text><text x="374" y="173">Purchases and when</text><text x="374" y="197">Preferences, boundaries</text><text x="374" y="221">Payday, what was promised</text><text x="374" y="245">Earlier shifts' notes</text></g>
 <path d="M465 264V284" stroke="#1AA3F5" stroke-width="2" marker-end="url(#ab)"/>

 <!-- Fan brief -->
 <rect x="340" y="290" width="250" height="84" rx="14" fill="#17344a" stroke="#4487AA"/>
 <text x="358" y="311" fill="#8db8d2" font-size="11" letter-spacing="1.2">FAN BRIEF · BESIDE THE CHAT</text>
 <text x="358" y="336" fill="#f0f8ff" font-size="14">Bought Friday's bundle</text>
 <text x="358" y="358" fill="#f0f8ff" font-size="14">Promised: news on next set</text>
 <path d="M338 318H288" stroke="#36D399" stroke-width="2" marker-end="url(#ag)"/>
 <text x="465" y="394" fill="#77a5c0" font-size="11" text-anchor="middle">Read by the chatter. Never sent.</text>

 <!-- Blocked connection AI -> fan -->
 <path d="M338 140H284" stroke="#6d5560" stroke-width="2" stroke-dasharray="4 5"/>
 <circle cx="310" cy="140" r="12" fill="#2a1d27" stroke="#F28B82" stroke-width="1.6"/>
 <path d="M305 135L315 145M315 135L305 145" stroke="#F28B82" stroke-width="2" stroke-linecap="round"/>

 <path d="M30 416H590" stroke="#284960"/>
 <text x="30" y="436" fill="#77a5c0" font-size="11" letter-spacing="1">ILLUSTRATIVE WORKFLOW</text>
 <text x="590" y="436" fill="#F5B4AE" font-size="12" letter-spacing="1" font-weight="700" text-anchor="end">✕ AI NEVER MESSAGES THE FAN</text>
</g>
</svg>
