<svg xmlns="http://www.w3.org/2000/svg" width="620" height="448" viewBox="0 0 620 448" role="img" aria-labelledby="title desc">
<title id="title">What a quiet month costs you</title><desc id="desc">Illustrative comparison of three ways to pay for Fanvue chatting in a quiet month. Doing it yourself costs your hours and leaves gaps overnight. Hourly freelancers cost the same for every hour online, sales or not. A commission-only agency costs a share of the tips and PPV its chatters close, so a quiet month costs less.</desc>
<rect x="1" y="1" width="618" height="446" rx="24" fill="#0e2134" stroke="#284960"/>
<circle cx="36" cy="36" r="4" fill="#36d399"/><text x="51" y="41" fill="#9cbacf" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.4">WHAT A QUIET MONTH COSTS YOU</text>
<path d="M30 61H590" stroke="#284960"/>
<g font-family="Arial,sans-serif">
<rect x="30" y="80" width="176" height="300" rx="16" fill="#17344a" stroke="#2c5069"/>
<text x="48" y="108" fill="#8db8d2" font-size="11" letter-spacing="1.2">DO IT YOURSELF</text>
<text x="48" y="140" fill="#f0f8ff" font-size="22" font-weight="700">Your hours</text>
<text x="48" y="164" fill="#a9cbe0" font-size="12">No invoice. Nights</text><text x="48" y="180" fill="#a9cbe0" font-size="12">and content suffer.</text>
<rect x="48" y="232" width="30" height="128" rx="5" fill="#2a4a63"/><rect x="88" y="300" width="30" height="60" rx="5" fill="#2a4a63"/><rect x="128" y="270" width="30" height="90" rx="5" fill="#2a4a63"/>
<text x="48" y="220" fill="#77a5c0" font-size="10" letter-spacing="1">YOUR TIME, NOT CASH</text>
<rect x="222" y="80" width="176" height="300" rx="16" fill="#17344a" stroke="#2c5069"/>
<text x="240" y="108" fill="#8db8d2" font-size="11" letter-spacing="1.2">HOURLY FREELANCERS</text>
<text x="240" y="140" fill="#f0f8ff" font-size="22" font-weight="700">Fixed</text>
<text x="240" y="164" fill="#a9cbe0" font-size="12">Paid per hour online,</text><text x="240" y="180" fill="#a9cbe0" font-size="12">sales or no sales.</text>
<rect x="240" y="250" width="30" height="110" rx="5" fill="#56b9e6"/><rect x="280" y="250" width="30" height="110" rx="5" fill="#56b9e6"/><rect x="320" y="250" width="30" height="110" rx="5" fill="#56b9e6"/>
<text x="240" y="220" fill="#77a5c0" font-size="10" letter-spacing="1">SAME BILL EVERY WEEK</text>
<rect x="414" y="80" width="176" height="300" rx="16" fill="#183f5a" stroke="#1aa3f5"/>
<text x="432" y="108" fill="#87d9ff" font-size="11" letter-spacing="1.2">COMMISSION AGENCY</text>
<text x="432" y="140" fill="#f0f8ff" font-size="22" font-weight="700">With sales</text>
<text x="432" y="164" fill="#a9cbe0" font-size="12">A share of the tips and</text><text x="432" y="180" fill="#a9cbe0" font-size="12">PPV its chatters close.</text>
<rect x="432" y="320" width="30" height="40" rx="5" fill="#36d399"/><rect x="472" y="290" width="30" height="70" rx="5" fill="#36d399"/><rect x="512" y="336" width="30" height="24" rx="5" fill="#36d399"/>
<text x="432" y="220" fill="#77a5c0" font-size="10" letter-spacing="1">FALLS WHEN QUIET</text>
<text x="31" y="424" fill="#77a5c0" font-size="12" letter-spacing="1">ILLUSTRATIVE SHAPES · NOT MARKET RATES OR REAL ACCOUNT DATA</text>
</g>
</svg>
