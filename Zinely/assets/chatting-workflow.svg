<svg xmlns="http://www.w3.org/2000/svg" width="620" height="448" viewBox="0 0 620 448" fill="none">
 <defs>
  <linearGradient id="panel" x1="155" y1="100" x2="469" y2="408" gradientUnits="userSpaceOnUse"><stop stop-color="#163B55"/><stop offset="1" stop-color="#0D2033"/></linearGradient>
  <linearGradient id="line" x1="191" y1="400" x2="425" y2="400" gradientUnits="userSpaceOnUse"><stop stop-color="#39B9FC"/><stop offset="1" stop-color="#56DAB0"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#168AD2" stop-opacity=".2"/><stop offset="1" stop-color="#168AD2" stop-opacity="0"/></radialGradient>
  <style>text{font-family:Arial,sans-serif}.float{animation:arrive 1s ease-out both}.bubble{animation:message 1.1s .15s ease-out both}.signal{stroke-dasharray:7 12;animation:travel 2.5s linear 3}@keyframes arrive{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes message{from{transform:translate(22px,-10px);opacity:0}to{transform:translate(0,0);opacity:1}}@keyframes travel{to{stroke-dashoffset:-76}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
 </defs>
 <ellipse cx="320" cy="245" rx="296" ry="200" fill="url(#glow)"/>
