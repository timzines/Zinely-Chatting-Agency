<svg xmlns="http://www.w3.org/2000/svg" width="620" height="448" viewBox="0 0 620 448" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">One persona brief, every chatting shift</title>
  <desc id="desc">Voice, approved offers and follow-up notes form one shared reference that carries into each shift.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="620" y2="448" gradientUnits="userSpaceOnUse"><stop stop-color="#13344D"/><stop offset="1" stop-color="#0A1829"/></linearGradient>
    <linearGradient id="line" x1="74" y1="0" x2="546" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#20B3F6"/><stop offset="1" stop-color="#64DFC9"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="618" height="446" rx="25" fill="url(#surface)" stroke="#244963"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="34" y="43" fill="#71CFFB" font-size="12" letter-spacing="2">FANVUE HANDOVER</text>
    <text x="34" y="78" fill="#EDF7FF" font-size="28" font-weight="700">One brief. Every shift.</text>
    <text x="34" y="106" fill="#A9C2D6" font-size="15">Carry the decisions forward with the conversation.</text>
    <path d="M105 205V240H515V205M310 240V269" stroke="url(#line)" stroke-width="2"/>
    <g>
      <rect x="34" y="137" width="143" height="80" rx="12" fill="#14364F" stroke="#35607B"/>
      <text x="51" y="164" fill="#73D0FA" font-size="12" font-weight="700">01 / VOICE</text>
      <text x="51" y="189" fill="#EDF7FF" font-size="15">Approved examples</text>
      <rect x="189" y="137" width="242" height="80" rx="12" fill="#14364F" stroke="#35607B"/>
      <text x="207" y="164" fill="#73D0FA" font-size="12" font-weight="700">02 / OFFERS</text>
      <text x="207" y="189" fill="#EDF7FF" font-size="15">Content, price and approval</text>
      <rect x="443" y="137" width="143" height="80" rx="12" fill="#14364F" stroke="#35607B"/>
      <text x="460" y="164" fill="#73D0FA" font-size="12" font-weight="700">03 / NOTES</text>
      <text x="460" y="189" fill="#EDF7FF" font-size="15">Next action</text>
    </g>
    <rect x="141" y="267" width="338" height="96" rx="14" fill="#133D4B" stroke="#4AAEA9"/>
    <circle cx="173" cy="299" r="6" fill="#78E6CA"/>
    <text x="190" y="305" fill="#EDF7FF" font-size="19" font-weight="700">The next shift starts here</text>
    <text x="164" y="335" fill="#B7DAD9" font-size="15">Read the brief. Check the thread. Continue.</text>
    <text x="34" y="410" fill="#87A8C0" font-size="13">Recommended workflow · not client performance data</text>
  </g>
</svg>
