<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-labelledby="title desc">
<title id="title">A cold shift compared with a briefed shift</title><desc id="desc">The same fan message, "hey, did you check?", arrives on two shifts. On the cold shift the chatter cannot see what the fan bought, what was promised or what the last shift agreed, so they guess or ask again. On the briefed shift a fan profile beside the chat shows the purchase, the open promise and the last shift's note. AI gathers the history into the profile; a human chatter reads it and sends every message.</desc>
<rect x="1" y="1" width="678" height="398" rx="22" fill="#0e2134" stroke="#284960"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="20" width="310" height="296" rx="16" fill="#102a3e" stroke="#2f4d63"/>
<circle cx="42" cy="44" r="4" fill="#f0a35b"/>
<text x="54" y="49" fill="#9cbacf" font-size="12" letter-spacing="1.4">COLD SHIFT</text>
<rect x="38" y="66" width="200" height="40" rx="14" fill="#17344a" stroke="#2c516b"/>
<text x="54" y="91" fill="#d7e9f4" font-size="16">hey, did you check?</text>
<rect x="38" y="122" width="274" height="46" rx="9" fill="none" stroke="#3b5a70" stroke-dasharray="5 5"/>
<text x="52" y="139" fill="#6f93ab" font-size="10" letter-spacing="1.2">BOUGHT</text><text x="52" y="158" fill="#7f9db3" font-size="15">?</text>
<rect x="38" y="176" width="274" height="46" rx="9" fill="none" stroke="#3b5a70" stroke-dasharray="5 5"/>
<text x="52" y="193" fill="#6f93ab" font-size="10" letter-spacing="1.2">PROMISED</text><text x="52" y="212" fill="#7f9db3" font-size="15">?</text>
<rect x="38" y="230" width="274" height="46" rx="9" fill="none" stroke="#3b5a70" stroke-dasharray="5 5"/>
<text x="52" y="247" fill="#6f93ab" font-size="10" letter-spacing="1.2">LAST SHIFT</text><text x="52" y="266" fill="#7f9db3" font-size="15">?</text>
<text x="38" y="300" fill="#ffc58f" font-size="14">Guesses, or asks the fan again</text>
<rect x="350" y="20" width="310" height="296" rx="16" fill="#12324a" stroke="#3f7a9e"/>
<circle cx="372" cy="44" r="4" fill="#36d399"/>
<text x="384" y="49" fill="#9cbacf" font-size="12" letter-spacing="1.4">BRIEFED SHIFT</text>
<rect x="368" y="66" width="200" height="40" rx="14" fill="#17344a" stroke="#2c516b"/>
<text x="384" y="91" fill="#d7e9f4" font-size="16">hey, did you check?</text>
<rect x="368" y="122" width="274" height="46" rx="9" fill="#173f5a" stroke="#2f6688"/>
<text x="382" y="139" fill="#87c4e6" font-size="10" letter-spacing="1.2">BOUGHT</text><text x="382" y="158" fill="#eaf6ff" font-size="15">Set A, on Tuesday</text>
<rect x="368" y="176" width="274" height="46" rx="9" fill="#173f5a" stroke="#2f6688"/>
<text x="382" y="193" fill="#87c4e6" font-size="10" letter-spacing="1.2">PROMISED</text><text x="382" y="212" fill="#eaf6ff" font-size="15">Ask the creator about the request</text>
<rect x="368" y="230" width="274" height="46" rx="9" fill="#173f5a" stroke="#2f6688"/>
<text x="382" y="247" fill="#87c4e6" font-size="10" letter-spacing="1.2">LAST SHIFT</text><text x="382" y="266" fill="#eaf6ff" font-size="15">Approved. Reply with the answer</text>
<text x="368" y="300" fill="#8ff0c6" font-size="14">Reads the profile, then replies</text>
<path d="M30 338H650" stroke="#284960"/>
<text x="340" y="362" fill="#c4dcec" font-size="14" text-anchor="middle">AI gathers the history into the profile. A human chatter sends every message.</text>
<text x="340" y="384" fill="#6f93ab" font-size="11" letter-spacing="1" text-anchor="middle">ILLUSTRATIVE · NO REAL FAN DATA</text>
</g>
</svg>
